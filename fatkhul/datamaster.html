<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Master - SoftwareHouse App</title>
    <style>
        /* ================= CSS DATA MASTER ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f8f9fa;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: #2b3035;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            flex-shrink: 0;
        }

        .brand {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            padding-bottom: 20px;
            border-bottom: 1px solid #444;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .nav-menu {
            list-style: none;
            padding: 0 15px;
        }

        .nav-menu li {
            margin-bottom: 10px;
        }

        .nav-menu a {
            display: block;
            padding: 12px 15px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            transition: background 0.3s;
        }

        .nav-menu a:hover {
            background-color: #3b4046;
        }

        .nav-menu a.active {
            background-color: #0d6efd;
            font-weight: 500;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            font-weight: 600;
        }

        .role-badge {
            background-color: #0d6efd;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        /* Table Styles Khusus Data Master */
        .table-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .btn-add {
            background-color: #198754;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-add:hover { 
            background-color: #157347; 
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #dee2e6;
        }

        th {
            background-color: #f8f9fa;
            color: #495057;
            font-weight: 600;
        }

        .badge-success {
            background-color: #d1e7dd;
            color: #0f5132;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-warning {
            background-color: #fff3cd;
            color: #664d03;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="brand">
            SoftwareHouse<br>App
        </div>
        <ul class="nav-menu">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="data-master.html" class="active">Data Master</a></li>
            <li><a href="laporan.html">Laporan</a></li>
        </ul>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="header">
            <h1>Data Master</h1>
            <div class="role-badge">Role: Junior Developer</div>
        </div>

        <!-- Tabel Data Master -->
        <div class="table-container">
            <div class="table-header">
                <h3>Daftar Modul Proyek</h3>
                <button class="btn-add">+ Tambah Data</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Modul</th>
                        <th>Developer</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Modul Login & Auth</td>
                        <td>Budi</td>
                        <td><span class="badge-success">Selesai</span></td>
                        <td><a href="#" style="color: #0d6efd; text-decoration: none;">Edit</a></td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Modul Master Barang</td>
                        <td>Siti</td>
                        <td><span class="badge-warning">Progress</span></td>
                        <td><a href="#" style="color: #0d6efd; text-decoration: none;">Edit</a></td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>Modul Laporan Penjualan</td>
                        <td>Andi</td>
                        <td><span class="badge-warning">Progress</span></td>
                        <td><a href="#" style="color: #0d6efd; text-decoration: none;">Edit</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
